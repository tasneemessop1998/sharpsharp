:root{--ink:#221E47;--paper:#fff;--mist:#F2EFFA;--fog:#DAD5EC;--mute:#676286;--gold:#FFC93C;--ok:#1FA862;--okl:#D8F6E5;--hot:#E8334A;--bg:#221E47;--team:#FFC93C;--bw:2.5px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background-color .6s;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
h2,h3,p,ol,ul,dl,dd{margin:0}
h2{font:700 20px/1.2 Lexend,sans-serif}
h3{font:600 15px/1.3 Lexend,sans-serif;margin-top:16px;margin-bottom:6px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #7C5CFF;outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--mute);font-size:13px}
.err,.warn{color:var(--hot);font-weight:500;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row.end{justify-content:flex-end;margin-top:18px}
.ani{flex:none;display:block;overflow:visible}
.ani.halo{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff)}
.fxi{flex:none;fill:var(--ink)}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
#app>main{display:none;flex:1;min-height:0}
#app[data-screen=boot]>#boot,#app[data-screen=setup]>#setup{display:grid;place-items:center;color:#fff;padding:24px}
#app[data-screen=home]>#home{display:block;overflow:auto}
#app[data-screen=room]>#room{display:grid}
#app:not([data-screen=room])>#bar{display:none}

/* top bar */
#bar{display:flex;align-items:center;gap:8px;margin:10px 12px;padding:6px 8px 6px 16px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:18px;flex:none}
#logo{font:400 25px/1 Shrikhand,Georgia,serif;color:var(--ink);text-decoration:none;white-space:nowrap;padding-top:2px}
.grow{flex:1}
#roomchip{display:inline-flex;align-items:center;gap:8px;background:var(--mist);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;margin-left:6px}
#roomchip b{font-weight:700;letter-spacing:.14em;font-size:15px}
#roomchip i{font-style:normal;display:inline-flex;align-items:center;gap:4px;color:var(--mute)}
#net{background:var(--hot);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.icon{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:inline-grid;place-items:center;font:600 17px/1 Lexend,sans-serif;padding:0;flex:none}
.icon:hover{background:var(--mist)}
.icon.sm{width:28px;height:28px;font-size:16px}
#mini{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);background:var(--paper);border:var(--bw) solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:0 3px 0 var(--ink)}
.btn.primary{background:var(--gold)}
.btn.go{background:var(--tc,var(--gold));flex:1}
.btn.big{width:100%;padding:13px 16px;font-size:17px;border-radius:14px;margin-top:10px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn.sm:hover:not(:disabled){box-shadow:0 3px 0 var(--ink)}
.btn.quiet{border-color:transparent;box-shadow:none;color:var(--mute)}
.btn.quiet:hover:not(:disabled){box-shadow:none;background:var(--mist)}
.btn.danger{color:var(--hot)}

/* home */
#home{color:#fff}
.homewrap{max-width:560px;margin:0 auto;padding:max(28px,6vh) 18px 40px;text-align:center}
.logo-xl{font:400 clamp(64px,17vw,124px)/.86 Shrikhand,Georgia,serif;color:var(--gold);margin:0;transform:rotate(-4deg);letter-spacing:-.01em}
.tag{font-size:19px;font-weight:300;margin-top:22px;letter-spacing:.01em}
#parade{display:flex;justify-content:center;gap:clamp(2px,1.4vw,10px);margin:26px 0 30px}
#parade span{display:block;animation:hopin .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*70ms + .15s)}
#parade.swap span{animation:none}
#parade{min-height:clamp(34px,10.5vw,62px)}
#parade .ani,#parade .bead{width:clamp(34px,10.5vw,62px);height:auto}
@keyframes hopin{from{opacity:0;transform:translateY(46px) scale(.5)}to{opacity:1;transform:none}}
.door{background:var(--paper);color:var(--ink);border-radius:24px;padding:22px;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.35)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
input,textarea{width:100%;border:var(--bw) solid var(--ink);border-radius:12px;padding:11px 13px;font-size:16px;background:#fff}
textarea{resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:#9A96B3}
.doors{display:grid;gap:14px;margin-top:16px}
.doors .pair{display:flex;gap:8px}
.doors .pair input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.doors .pair input::placeholder{letter-spacing:0;text-transform:none;font-weight:400}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:2px dashed var(--fog)}
.door .btn{padding:11px 16px;font-size:15px}
.door .wide{width:100%}
#homeerr{margin-top:12px}
.fine{margin-top:18px;color:#CFCBE6;font-size:14px;text-align:center}
.fine a{color:#fff}
.note{background:var(--paper);color:var(--ink);border-radius:20px;padding:24px;max-width:520px}
.note ol{padding-left:20px;margin-top:10px;display:grid;gap:8px}
.note p{margin-top:8px}
code{background:var(--mist);padding:1px 6px;border-radius:6px;font-size:.92em}

/* room frame */
#room{grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:minmax(0,1fr);gap:12px;padding:0 12px 12px}
#stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
#side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
#turn,#chat,#scores,#boardwrap{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:18px}
#room[data-phase=lobby] #strip,#room[data-phase=lobby] #boardwrap,#room[data-phase=lobby] #sidetabs,#room[data-phase=lobby] #scores,#room[data-phase=game] #lobby{display:none}
#mtabs{display:none}

/* team strip */
#strip{display:flex;gap:8px;flex:none;overflow-x:auto;padding:2px 2px 5px}
.tchip{flex:1 1 0;min-width:118px;display:flex;align-items:center;gap:8px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:14px;padding:5px 12px 6px 7px;transition:transform .2s,box-shadow .2s}
.tchip>div{min-width:0;flex:1}
.tchip b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tchip span{font-size:12px;color:var(--mute);white-space:nowrap}
.tchip em{font-style:normal;font-size:10.5px;font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tchip .bar{display:block;height:6px;border-radius:3px;background:var(--mist);overflow:hidden;margin-top:2px}
.tchip .bar i{display:block;height:100%;background:var(--tc);border-radius:3px;transition:width .8s}
.tchip.cur{background:var(--tl);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.tchip.won{background:var(--gold)}

/* board */
#boardwrap{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
#board{flex:1;min-height:0;width:100%;display:block}
#board .num{font:700 15px Lexend,sans-serif;fill:var(--ink);opacity:.45;pointer-events:none}
#board .endtxt{font:400 21px Shrikhand,Georgia,serif;fill:var(--ink);pointer-events:none}
#board .tile,#board .tok{cursor:pointer}
#board .tile:hover>circle,#board .tile:hover>rect{stroke-width:5}
#board .shade{fill:#0d0a2a;opacity:.28}
#board .ring{opacity:0;transform-box:fill-box;transform-origin:center}
#board .tok.cur .ring{opacity:1;animation:ring 1.5s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.86);opacity:.95}50%{transform:scale(1.08);opacity:.45}}
/* the 3D table fills the window; panels float over it as dark glass */
#stage3d{position:fixed;inset:0;z-index:0;display:none;background:#0d0a08}
body[data-d3="1"] #stage3d{display:block}
#stage3d canvas.gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage3d canvas.gl:active{cursor:grabbing}
#stage3d::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 50%,transparent 52%,rgba(0,0,0,.5) 100%)}
#stage3d .dof{position:absolute;left:0;right:0;pointer-events:none;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
#stage3d .dof.top{top:0;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
#stage3d .dof.bot{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000 80%);mask-image:linear-gradient(transparent,#000 80%)}
#bar,#app>main{position:relative;z-index:1}
#hint3d{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;background:rgba(13,10,8,.72);color:#fff;font-size:12.5px;padding:5px 14px;border-radius:999px;pointer-events:none;opacity:0;white-space:nowrap}
#hint3d.show{animation:hint 7s ease-out forwards}
@keyframes hint{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
#room[data-mode="3d"] #board,#room[data-mode="3d"] #legend{display:none}
#room[data-mode="3d"] #bigcount{place-items:start center;padding-top:12px}
#room[data-mode="3d"] #bigcount b:not(.long){font-size:clamp(44px,7vw,76px);-webkit-text-stroke-width:6px}
#room[data-mode="3d"] #bigcount b.long{align-self:center}
img.bead{flex:none;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.32))}
body[data-d3="1"]{background:#0d0a08}
body[data-d3="1"] #room,body[data-d3="1"] #stage,body[data-d3="1"] #boardwrap{pointer-events:none}
body[data-d3="1"] #strip,body[data-d3="1"] #side,body[data-d3="1"] #mtabs,body[data-d3="1"] #mini{pointer-events:auto}
body[data-d3="1"] #boardwrap{background:transparent;border-color:transparent;overflow:visible}
body[data-lux="1"] #bar,body[data-lux="1"] #room{--ink:#F7F1E7;--paper:rgba(22,16,12,.6);--mist:rgba(255,255,255,.09);--fog:rgba(255,255,255,.2);--mute:#C6BBAC;--okl:rgba(52,211,153,.2);--ok:#4ADE80;--hot:#FF7183;color:var(--ink)}
body[data-lux="1"] #bar,body[data-lux="1"] #turn,body[data-lux="1"] #chat,body[data-lux="1"] #scores,body[data-lux="1"] .tchip,body[data-lux="1"] #mini{background:var(--paper);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);box-shadow:0 14px 36px rgba(0,0,0,.42)}
body[data-lux="1"] #logo{color:var(--gold)}
body[data-lux="1"] #roomchip{background:var(--mist);border:1px solid rgba(255,255,255,.22);color:var(--ink)}
body[data-lux="1"] .icon{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);color:var(--ink)}
body[data-lux="1"] .icon:hover{background:rgba(255,255,255,.16)}
body[data-lux="1"] #room .btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);box-shadow:none;color:var(--ink)}
body[data-lux="1"] #room .btn:hover:not(:disabled){background:rgba(255,255,255,.18);box-shadow:none}
body[data-lux="1"] #room .btn.primary{background:linear-gradient(#FFD763,#F2B632);border-color:rgba(0,0,0,.25);color:#221E47;box-shadow:0 6px 18px rgba(242,182,50,.35)}
body[data-lux="1"] #room .btn.primary:hover:not(:disabled){background:linear-gradient(#FFDF7F,#F5BE45);box-shadow:0 8px 22px rgba(242,182,50,.45)}
body[data-lux="1"] .tchip.cur{background:color-mix(in srgb,var(--tc) 42%,rgba(22,16,12,.6));box-shadow:0 0 0 2px var(--tc),0 14px 36px rgba(0,0,0,.42);transform:none}
body[data-lux="1"] .tchip .bar{background:rgba(255,255,255,.16)}
body[data-lux="1"] .tchip em{background:#F7F1E7;color:#221E47}
body[data-lux="1"] .who,body[data-lux="1"] .phead,body[data-lux="1"] .steam header{background:color-mix(in srgb,var(--tc) 36%,transparent)}
body[data-lux="1"] .clock{background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
body[data-lux="1"] .clock .trk{stroke:rgba(255,255,255,.13)}
body[data-lux="1"] .fxchip{background:rgba(255,255,255,.14)}
body[data-lux="1"] #room .fxi{fill:#F7F1E7}
body[data-lux="1"] .slot .by{color:#86EFAC}
body[data-lux="1"] .slot.miss{background:transparent;border-color:rgba(255,255,255,.22)}
body[data-lux="1"] .lastwords i.y{color:#86EFAC}
body[data-lux="1"] .lockbar{background:rgba(26,19,14,.97)}
body[data-lux="1"] .joinnow .btn{background:color-mix(in srgb,var(--tc) 46%,transparent)}
body[data-lux="1"] .steam em.now{color:#221E47}
body[data-lux="1"] #chatform{border-top:1px solid rgba(255,255,255,.14)}
body[data-lux="1"] #chatform input{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.26);color:#fff}
body[data-lux="1"] #chatform input::placeholder{color:#A99F92}
body[data-lux="1"] #chatform input:disabled{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.12)}
body[data-lux="1"] .accept{background:var(--gold);border:0;color:#221E47}
body[data-lux="1"] #sidetabs button,body[data-lux="1"] #mtabs button{background:rgba(22,16,12,.6);border:1px solid rgba(255,255,255,.2);color:var(--ink);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body[data-lux="1"] #sidetabs button.on,body[data-lux="1"] #mtabs button.on{background:#F7F1E7;color:#221E47}
body[data-lux="1"] #tip{background:rgba(13,10,8,.92);color:#fff;border:1px solid rgba(255,255,255,.2)}
body[data-lux="1"] #bigcount b{-webkit-text-stroke-color:#15100c;text-shadow:0 8px 0 #15100c}
/* the describer's card stays a real card: cream stock, dark ink */
body[data-lux="1"] ol.card.mine{--ink:#221E47;--fog:#E2D8C5;--mist:#F3ECDD;--okl:#D8F6E5;--ok:#1FA862;--mute:#6f6a80;color:#221E47;background:linear-gradient(175deg,#FFFDF7,#F3EAD8);border:0;box-shadow:0 16px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.1);border-radius:14px}
body[data-lux="1"] ol.card.mine .slot{background:transparent;border-color:transparent;border-bottom:1px solid var(--fog);border-radius:8px}
body[data-lux="1"] ol.card.mine li:last-child .slot{border-bottom-color:transparent}
body[data-lux="1"] ol.card.mine .slot.hit{background:var(--okl);border-color:var(--ok)}
body[data-lux="1"] ol.card.mine .slot.miss{background:transparent;border:1px dashed #cfc4ae}
body[data-lux="1"] ol.card.mine .slot .by{color:#0E6B3C}
body[data-lux="1"]{background:#0d0a08 radial-gradient(95% 75% at 50% -5%,#3b2516 0%,#1a110b 55%,#0d0a08 100%);background-attachment:fixed}
body[data-lux="1"] .tcard{background:var(--paper);border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 36px rgba(0,0,0,.42)}
body[data-lux="1"] .tcard.mine{border:2px solid var(--tc)}
body[data-lux="1"] .tcard header{background:color-mix(in srgb,var(--tc) 36%,transparent)}
body[data-lux="1"] .tcard.add{background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.35);box-shadow:none}
body[data-lux="1"] #room .btn.go{background:var(--tc);color:#221E47;border-color:rgba(0,0,0,.25)}
body[data-lux="1"] #room .btn.quiet{background:transparent;border-color:transparent;color:var(--mute)}
body[data-lux="1"] .seg{border:1px solid rgba(255,255,255,.3)}
body[data-lux="1"] .seg button{background:transparent;color:var(--ink)}
body[data-lux="1"] .seg button+button{border-left:1px solid rgba(255,255,255,.3)}
body[data-lux="1"] .seg button.on{background:#F7F1E7;color:#221E47}
body[data-lux="1"] .seg button:disabled:not(.on){color:#8f8679}
body[data-lux="1"] .lobbyhead p{color:var(--mute)}
body[data-lux="1"] .lobbyhead p b{color:#fff}
body[data-lux="1"] #lobby .loose{color:var(--mute)}
body[data-lux="1"] .fine{color:#B9AFA3}
body[data-lux="1"] .door{box-shadow:0 22px 50px rgba(0,0,0,.6)}
#legend{position:absolute;left:14px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px 2px 6px}
#legend:empty{display:none}
.fx-time.fxi,.fxnote.fx-time .fxi,.fxchip.fx-time .fxi{fill:#1479C9}
.fx-shield.fxi{fill:#178A52}
.fx-jackpot.fxi{fill:#C98A00}
#bigcount{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
#bigcount b{font:400 clamp(120px,24vw,260px)/1 Shrikhand,Georgia,serif;color:var(--team);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);animation:bigpop .34s cubic-bezier(.2,1.6,.4,1) both}
#bigcount b.long{font-size:clamp(60px,10vw,120px);-webkit-text-stroke-width:8px;white-space:nowrap}
@keyframes bigpop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:rotate(-4deg)}}
#tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;padding:9px 13px;border-radius:12px;font-size:13px;width:max-content;max-width:220px;z-index:5;pointer-events:none;line-height:1.35}
#tip[data-below="1"]{transform:translate(-50%,0)}
#tip b{display:block;font-weight:600}
#tip span{display:block;opacity:.86}

/* lobby */
#lobby{flex:1;min-height:0;overflow:auto;color:#fff;padding:4px 2px 10px}
.lobbyhead h2{font:400 34px/1 Shrikhand,Georgia,serif;color:var(--gold)}
.lobbyhead p{margin:8px 0 14px;color:#D9D5EE}
.lobbyhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 16px}
.lobbyhead>div{flex:1;min-width:240px}
.lobbyhead .btn{margin-bottom:14px}
.lobbyhead p b{letter-spacing:.12em;color:#fff}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;border:4px solid transparent}
.tcard.mine{border-color:var(--tc)}
.tcard header{display:flex;align-items:center;gap:12px;background:var(--tl);padding:12px 12px 12px 14px}
.tcard header div{flex:1;min-width:0}
.tcard h3{font-size:18px;font-weight:700;margin:0;overflow-wrap:anywhere}
.tcard header span{font-size:13px;color:var(--mute)}
.tcard ul{list-style:none;padding:10px 14px 4px;display:grid;gap:5px;flex:1;min-height:56px;align-content:start}
.tcard li{display:flex;align-items:center;gap:7px;font-size:15px}
.tcard li.me span{font-weight:600}
.tcard li em,.steam em{font-style:normal;font-size:11.5px;color:var(--mute);background:var(--mist);border-radius:999px;padding:1px 7px;display:inline-flex;gap:3px;align-items:center}
.tcard footer{display:flex;gap:8px;padding:10px 12px 14px;flex-wrap:wrap}
.tcard.add{background:transparent;border:2.5px dashed rgba(255,255,255,.5);color:#fff;align-items:center;justify-content:center;min-height:170px;font-weight:500;gap:2px}
.tcard.add b{font-size:40px;font-weight:300;line-height:1}
.tcard.add:hover{background:rgba(255,255,255,.08)}
.pres{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:#B9B4D0}
.pres.on{background:var(--ok)}
.loose{margin-top:14px;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#lobby .loose{color:#D9D5EE}

/* turn panel */
#turn{--tp:14px;flex:0 1 auto;min-height:0;overflow:auto;padding:var(--tp)}
.lockbar{background:var(--paper);margin:10px calc(-1*var(--tp)) calc(-1*var(--tp));padding:0 var(--tp) var(--tp);border-top:2px dashed var(--fog)}
.lockbar.stick{position:sticky;bottom:0}
.lockbar .sum{margin-top:9px}
.lockbar .wait{margin-top:4px}
.who{display:flex;align-items:center;gap:12px;background:var(--tl);border-radius:14px;padding:8px 12px 8px 10px}
.who b{display:block;font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--mute)}
.lead{margin-top:10px;font-size:14.5px}
.wait{margin-top:10px;color:var(--mute);font-size:14px}
.wait::after{content:"…";animation:dots 1.4s steps(4,end) infinite;display:inline-block;overflow:hidden;vertical-align:bottom;width:0}
@keyframes dots{to{width:1.2em}}
#turn .warn{margin-top:8px}
#turn .btn.sm{margin-top:10px}
#turn>.muted{margin-top:8px}
.fxnote{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--mist);border-radius:10px;padding:7px 10px;font-size:13.5px}
.joinnow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;background:var(--mist);border-radius:12px;padding:8px 10px}
.joinnow span{flex-basis:100%;font-weight:500}
.joinnow .btn{margin-top:0!important;background:var(--tl)}
.last{margin-top:12px;border-top:2px dashed var(--fog);padding-top:10px;font-size:13px;display:grid;gap:2px}
.last b{font-weight:600}
.last>span{color:var(--mute)}
.lastwords{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.lastwords i{font-style:normal;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--mist);color:var(--mute);text-decoration:line-through}
.lastwords i.y{background:var(--okl);color:#0E6B3C;text-decoration:none}
.phead{display:flex;align-items:center;gap:12px;background:var(--tl);border-radius:14px;padding:8px 12px 8px 8px}
.phead.over{display:block;padding:10px 14px 9px}
.phead.over span{font-size:13px;color:var(--mute)}
.pinfo{min-width:0;display:grid;gap:1px}
.pinfo>b{font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.pinfo>span{font-size:13px;color:var(--mute)}
.dierow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;min-height:28px}
.clock{position:relative;width:86px;height:86px;flex:none;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 var(--bw) var(--ink)}
.clock svg{position:absolute;inset:0;width:100%;height:100%}
.clock .trk{fill:none;stroke:var(--mist);stroke-width:10}
.clock .arc{fill:none;stroke:var(--team);stroke-width:10;stroke-dasharray:326.7;transition:stroke-dashoffset .14s linear,stroke .3s}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font:800 34px/1 Lexend,sans-serif;font-variant-numeric:tabular-nums}
.clock.count b{font:400 44px/1 Shrikhand,Georgia,serif}
.clock.urgent .arc{stroke:var(--hot)}
.clock.urgent b{color:var(--hot);animation:throb .5s ease-in-out infinite}
.clock.over b{color:var(--mute)}
@keyframes throb{50%{transform:scale(1.13)}}
.die{width:28px;height:28px;flex:none}
.die svg{width:100%;height:100%;display:block}
.die.rolling{animation:shake .32s linear infinite}
@keyframes shake{25%{transform:rotate(-14deg) translateY(-3px)}75%{transform:rotate(12deg) translateY(2px)}}
.dietxt{font-size:13px;font-weight:500}
.fxchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:#fff;border-radius:999px;padding:2px 9px 2px 6px}
.timesup{font:400 30px/1.05 Shrikhand,Georgia,serif;color:var(--hot)}
ol.card{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:5px}
ol.card.mine{background:#fff;border:var(--bw) solid var(--ink);border-radius:16px;padding:7px;box-shadow:0 5px 0 var(--ink);margin-bottom:6px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:36px;padding:5px 12px;border-radius:10px;border:2px solid transparent;background:var(--mist);font:600 15px/1.25 Lexend,sans-serif;text-align:left;color:var(--ink)}
.card.mine .slot{min-height:44px;font-size:19px;background:#fff;border-color:var(--fog)}
.card.mine button.slot:hover:not(:disabled){border-color:var(--ink)}
.slot .w{min-width:0;overflow-wrap:anywhere}
.slot .by{font-size:12px;font-weight:500;color:#0E6B3C;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.slot .by svg{width:16px;height:16px}
.slot.hit,.card.mine .slot.hit{background:var(--okl);border-color:var(--ok)}
.slot.miss,.card.mine .slot.miss{background:#fff;border:2px dashed var(--fog);color:var(--mute)}
.slot .bars{display:block;height:9px;width:110px;border-radius:5px;background:var(--fog)}
.card li:nth-child(2n) .bars{width:150px}
.card li:nth-child(3n) .bars{width:84px}
.sum{margin-top:12px;font-size:15px}
.sum b{font-size:19px;font-weight:700}
.sum i{font-style:normal;color:var(--mute);padding:0 2px}
dl.cfg{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;align-items:center;margin-top:12px}
dl.cfg dt{font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--paper);border:0;padding:5px 9px;font-size:13px;font-weight:500}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled:not(.on){color:#A9A5C0}
.why{margin-top:8px}

/* chat and scores */
#sidetabs{display:flex;gap:6px;flex:none}
#sidetabs:empty{display:none}
#sidetabs button,#mtabs button{flex:1;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
#sidetabs button.on,#mtabs button.on{background:var(--ink);color:#fff}
#chat{flex:1 1 0;min-height:150px;display:flex;flex-direction:column;overflow:hidden}
#room[data-desc="1"] #chat{min-height:74px}
#room[data-desc="1"] #chatform{display:none}
#room[data-desc="1"] #sidetabs{display:none}
#board .tok.crowd .body>g{transform:translate(-22.4px,-28px) scale(.7)}
#chatlist{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
#chatlist .empty{margin:auto;text-align:center}
.msg{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;font-size:14px;padding:3px 6px;border-radius:8px;margin:0 -6px}
.msg b{font-weight:600}
.msg span{overflow-wrap:anywhere;min-width:0}
.tdot{width:9px;height:9px;border-radius:50%;background:var(--tc);border:1.5px solid var(--ink);flex:none;align-self:center}
.msg.ok{background:var(--okl)}
.okmark{color:var(--ok);align-self:center;display:inline-flex}
.okmark svg{width:16px;height:16px}
.msg.sys{color:var(--mute);font-size:12.5px;justify-content:center;text-align:center;padding:5px 6px}
.accept{background:var(--gold);border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:600;padding:2px 10px;margin:3px 0 2px 15px}
#chatform{display:flex;gap:6px;padding:8px;border-top:2px solid var(--fog);flex:none}
#chatform input{flex:1;min-width:0;padding:9px 12px;border-width:2px}
#chatform input:disabled{background:var(--mist);border-color:var(--fog)}
#chatform .btn{box-shadow:none;border-width:2px}
#scores{flex:1 1 0;min-height:0;overflow:auto;padding:10px}
.steam{margin-bottom:12px}
.steam header{display:flex;align-items:center;gap:8px;background:var(--tl);border-radius:10px;padding:5px 10px 5px 6px}
.steam header b{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steam header span{font-size:12.5px;color:var(--mute);white-space:nowrap}
.steam table{width:100%;border-collapse:collapse;font-size:14px;margin-top:2px}
.steam th{font-size:11.5px;font-weight:500;color:var(--mute);text-align:right;padding:4px 6px}
.steam th:first-child,.steam td:first-child{text-align:left}
.steam td{padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1.5px solid var(--mist);font-weight:600}
.steam td:first-child{font-weight:400;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steam tr.me td:first-child span{font-weight:700}
.steam tr.gone td{color:var(--mute)}
.steam em.now{background:var(--tc);color:var(--ink)}
.key{margin-top:4px}

/* dialogs, toasts */
#modal{position:fixed;inset:0;z-index:50;display:flex;padding:12px}
.scrim{position:absolute;inset:0;background:rgba(18,14,48,.62)}
.sheet{position:relative;margin:auto;width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:22px;padding:22px;box-shadow:0 8px 0 var(--ink)}
.sheet .close{position:absolute;right:12px;top:12px}
.sheet h2{padding-right:44px}
.sheet h2+p{margin-top:8px}
.sheet textarea{margin-top:12px}
.rules{padding-left:22px;display:grid;gap:9px;margin-top:12px}
.fxlist,.plain{list-style:none;padding:0;display:grid;gap:7px}
.fxlist li{display:flex;gap:9px;align-items:flex-start}
.fxlist .fxi{margin-top:2px}
.plain li{padding-left:16px;position:relative}
.plain li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.menu{display:grid;gap:10px;margin-top:16px}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1.5px solid var(--mist);font-size:14px}
.hrow>span:not(.steps){flex:1;min-width:0}
.steps{display:flex;gap:6px;flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;background:var(--sw);border:var(--bw) solid var(--ink);padding:0}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.sw:disabled{opacity:.22}
.zoo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zoo button{background:var(--paper);border:2px solid var(--fog);border-radius:14px;padding:8px 4px 6px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500}
.zoo button.on{border-color:var(--ink);background:var(--mist);box-shadow:0 3px 0 var(--ink)}
.zoo button:disabled{opacity:.25}
.winhead{display:grid;justify-items:center;gap:6px;background:var(--tl);border-radius:16px;padding:18px 12px 16px;margin-top:6px}
.winhead h2{font:400 clamp(30px,8vw,44px)/1 Shrikhand,Georgia,serif;padding:0;text-align:center}
.podium{list-style:none;padding:0;margin-top:14px;display:grid;gap:6px;counter-reset:pod}
.podium li{display:flex;align-items:center;gap:8px;background:var(--tl);border-radius:10px;padding:5px 12px 5px 8px;counter-increment:pod}
.podium li::before{content:counter(pod);font-weight:700;width:16px;text-align:center}
.podium li{flex-wrap:wrap}
.podium b{flex:1;font-weight:600}
.podium span{font-size:13px;color:var(--mute)}
.podium p{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 6px;padding:1px 0 3px 24px;font-size:13px}
.podium p i{font-style:normal;background:rgba(255,255,255,.75);border-radius:999px;padding:0 8px}
.podium p i b{font-weight:700;margin-left:3px}
.winnote{font-size:12px;color:var(--mute);margin-top:6px}
.awards{display:grid;gap:6px;margin-top:12px}
.awards b{display:block;font-size:12.5px;color:var(--mute);font-weight:500}
#toasts{position:fixed;left:0;right:384px;bottom:26px;z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:#fff;border:2px solid #fff;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500;animation:toastin .25s ease-out;transition:opacity .4s,transform .4s;text-align:center;max-width:100%}
.toast.big{background:var(--gold);color:var(--ink);border-color:var(--ink);font-size:17px;font-weight:700;padding:11px 22px;box-shadow:0 4px 0 var(--ink)}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:70}

@media (min-width:900px){
  #room[data-side=chat] #scores{display:none}
  #room[data-side=scores] #chat{display:none}
  #room[data-phase=lobby] #turn{flex:none;max-height:72%}
}
@media (max-width:1100px) and (min-width:900px){#room{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-height:640px) and (min-width:900px){
  #bar{margin:6px 12px;padding:3px 8px 3px 14px}
  .clock{width:72px;height:72px}.clock b{font-size:28px}.clock.count b{font-size:36px}
  .card.mine .slot{min-height:38px;font-size:17px}
  ol.card{gap:4px;margin-top:9px}
  #turn{--tp:10px}.who{padding:6px 10px}
  #turn .tall{display:none}
  .timesup{font-size:25px}
  .btn.big{padding:10px 14px}
  #strip{padding-bottom:4px}
  #chat{min-height:104px}
  .slot{min-height:31px;font-size:14.5px}
}
@media (max-width:899px){
  body{overflow:auto}
  #bar{margin:8px 10px;padding:4px 6px 4px 12px;gap:6px}
  #logo{font-size:21px}
  #roomchip span,#roomchip i{display:none}
  #roomchip{padding:5px 10px;margin-left:2px}
  .icon{width:36px;height:36px}
  #app[data-screen=room]>#room{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px}
  #room[data-phase=lobby]{overflow:auto}
  #room[data-phase=lobby] #stage,#room[data-phase=lobby] #side{flex:none}
  #room[data-phase=lobby] #lobby{overflow:visible;flex:none}
  #room[data-phase=lobby] #chat{flex:none;height:300px}
  #room[data-phase=lobby] #turn{overflow:visible}
  #room[data-phase=game] #mtabs{display:flex;gap:6px;flex:none;order:-2}
  #room[data-phase=game] #mini{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:4px 12px;font-size:13px;flex:none;order:-1}
  #room[data-phase=game][data-tab=play] #mini,#mini:empty{display:none!important}
  #mini b{font:800 20px/1 Lexend,sans-serif;font-variant-numeric:tabular-nums;min-width:26px}
  #stage,#side{flex:1;min-height:0}
  #room[data-phase=game][data-tab=play] #stage,#room[data-phase=game][data-tab=scores] #stage,#room[data-phase=game][data-tab=board] #side{display:none}
  #room[data-phase=game] #sidetabs{display:none}
  #room[data-phase=game][data-tab=play] #scores{display:none}
  #room[data-phase=game][data-tab=scores] #turn,#room[data-phase=game][data-tab=scores] #chat{display:none}
  #strip{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tchip{min-width:142px;flex:1 0 142px}
  #boardwrap{overflow-y:auto;display:block}
  #board{height:auto}
  #legend{position:static;padding:8px 8px 0;justify-content:center;gap:4px}
  #legend span{font-size:11px;padding:2px 7px 2px 5px}
  #bar [data-act=help]{display:none}
  .card.mine .slot{min-height:42px;font-size:18px}
  #room[data-desc="1"] #chat{min-height:60px}
  .teamgrid{grid-template-columns:1fr}
  .tcard.add{min-height:0;flex-direction:row;gap:10px;padding:12px}
  .tcard.add b{font-size:26px}
  .toast.big{font-size:15px;padding:9px 16px}
  .lobbyhead h2{font-size:30px}
  #toasts{top:112px;bottom:auto;right:0}
  .sheet{padding:18px}
  .zoo{grid-template-columns:repeat(4,1fr);gap:6px}
  .zoo .ani,.zoo .bead{width:44px;height:44px}
  body[data-d3="1"] #boardwrap{overflow:visible}
  body[data-lux="1"] #mini{border:1px solid rgba(255,255,255,.16)}
}
@media (max-width:899px) and (max-height:700px){
  .clock{width:72px;height:72px}.clock b{font-size:28px}.clock.count b{font-size:36px}
  .card.mine .slot{min-height:39px;font-size:17px}
  ol.card{gap:4px;margin-top:9px}
  #turn{--tp:10px}
  #turn .tall{display:none}
  .timesup{font-size:25px}
  .btn.big{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>

<body>
<div id="app" data-screen="boot">
  <div id="stage3d" role="img" aria-label="Game table"></div>
  <header id="bar">
    <span id="logo">Sharp Sharp</span>
    <button type="button" id="roomchip" data-act="copy" title="Copy the invite link" hidden></button>
    <span id="net" role="status" hidden>Reconnecting</span>
    <span class="grow"></span>
    <button type="button" class="icon" id="sndbtn" data-act="sound" aria-label="Sound"></button>
    <button type="button" class="icon" data-act="help" aria-label="How to play">?</button>
    <button type="button" class="icon" id="menubtn" data-act="menu" aria-label="Room menu" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="5" cy="12" r="2.1" fill="currentColor"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/><circle cx="19" cy="12" r="2.1" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="boot"><p>Setting up the board</p></main>
  <main id="setup"></main>

  <main id="home">
    <div class="homewrap">
      <h1 class="logo-xl">Sharp<br>Sharp</h1>
      <p class="tag">Five names. Thirty seconds. Talk fast.</p>
      <div id="parade" aria-hidden="true"></div>
      <div class="door">
        <label for="nm">Your name</label>
        <input id="nm" maxlength="16" autocomplete="nickname" placeholder="What your team calls you">
        <div class="doors">
          <form id="joinform" autocomplete="off">
            <label for="code">Got a room code?</label>
            <div class="pair"><input id="code" maxlength="4" placeholder="4 letters" autocapitalize="characters" spellcheck="false"><button class="btn primary" type="submit">Join the room</button></div>
          </form>
          <div class="or">or</div>
          <button type="button" class="btn wide" data-act="create">Start a new room</button>
          <button type="button" class="btn wide quiet" id="backroom" data-act="back" hidden></button>
        </div>
        <p id="homeerr" class="err" role="alert" hidden></p>
      </div>
      <p class="fine">Made for video calls: everyone opens this page on their own screen. <a href="#" data-act="help">How to play</a></p>
    </div>
  </main>

  <main id="room" data-phase="lobby" data-tab="play" data-side="chat">
    <nav id="mtabs" aria-label="Views"></nav>
    <div id="mini" aria-live="off"></div>
    <section id="stage">
      <div id="strip"></div>
      <div id="lobby"></div>
      <div id="boardwrap">
        <div id="legend"></div>
        <svg id="board" role="img" aria-label="Game board"></svg>
        <p id="hint3d">Drag to look around. Scroll or pinch to zoom.</p>
        <div id="tip" hidden></div>
        <div id="bigcount" aria-hidden="true"></div>
      </div>
    </section>
    <aside id="side">
      <div id="turn" aria-live="polite"></div>
      <div id="sidetabs"></div>
      <div id="chat">
        <div id="chatlist" aria-live="polite"></div>
        <form id="chatform" autocomplete="off"><input id="chatin" maxlength="120" aria-label="Chat or guess" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn primary" type="submit">Send</button></form>
      </div>
      <div id="scores"></div>
    </aside>
  </main>

  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="confetti"></canvas>
</div>

      d -= arc;

  let path = 'M' + x0 + ' ' + yRow(0);

    const odd = k % 2 === 1;
    if (k === rows - 1) { path += 'L' + pts[len].x.toFixed(1) + ' ' + yRow(k); break; }
